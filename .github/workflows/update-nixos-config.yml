name: Update nixos-config dotfiles input

on:
  push:
    branches: [master]
    paths:
      - '.config/**'
      - 'wallpapers/**'

jobs:
  update-dotfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Checkout nixos-config
        uses: actions/checkout@v4
        with:
          repository: Ashpex/nixos-config
          token: ${{ secrets.NIXOS_CONFIG_PAT }}

      - name: Update dotfiles input
        run: nix flake lock --update-input dotfiles

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.NIXOS_CONFIG_PAT }}
          commit-message: "chore: update dotfiles to latest commit"
          title: "chore: dotfiles ${{ github.event.head_commit.message }} (${{ env.SHORT_SHA }})"
          body: |
            Automated PR triggered by a new commit in [nixos-dotfiles](https://github.com/Ashpex/nixos-dotfiles).

            Updates `flake.lock` to point dotfiles input to the latest master commit.
          branch: auto/update-dotfiles
          base: master
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}" --repo Ashpex/nixos-config
        env:
          GH_TOKEN: ${{ secrets.NIXOS_CONFIG_PAT }}
