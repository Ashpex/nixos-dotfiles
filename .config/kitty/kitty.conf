# Kitty terminal configuration

# Font
font_family      FiraCode Nerd Font
font_size        12.0

# Theme (you can change this)
background       #1e1e2e
foreground       #cdd6f4
cursor           #f5e0dc

# Tab bar
tab_bar_style    powerline
tab_powerline_style slanted

# Window
window_padding_width 4

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes
