# Kitty terminal configuration

# Theme
include ~/.config/kitty/themes/noctalia.conf

# Font
font_family      FiraCode Nerd Font
font_size        12.0

# Tab bar
tab_bar_style    powerline
tab_powerline_style slanted

# Window
window_padding_width 4
background_opacity 0.85
background_blur 20

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes
